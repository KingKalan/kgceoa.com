<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KCEA — Devlog Entry</title>
  <meta name="description" content="KCEA development log entry." />
  <meta name="theme-color" content="#0b0f1a" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0f1a;
      --panel:#0f1524;
      --panel-2:#111a2b;
      --ink:#e7ecf7;
      --muted:#9fb2d9;
      --dim:#7182a5;
      --accent:#5fd4ff;
      --accent-2:#8a7dff;
      --gold:#efbf04;
      --line:rgba(255,255,255,.07);
      --radius:22px;
      --shadow:0 10px 24px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.025) inset;
    }

    *{box-sizing:border-box}

    html{
      min-height:100%;
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      margin:0;
      overflow-x:hidden;
      color:var(--ink);
      font-family:Inter,system-ui,sans-serif;
      background:
        radial-gradient(1100px 520px at 85% -10%, rgba(138,125,255,.16), transparent 60%),
        radial-gradient(900px 420px at 15% 110%, rgba(95,212,255,.11), transparent 60%),
        var(--bg);
    }

    .controller-field{
      position:fixed;
      inset:0;
      z-index:0;
      overflow:hidden;
      pointer-events:none;
      isolation:isolate;
    }

    .controller-field::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:2;
      background:rgba(11,15,26,.45);
    }

    .floating-controller{
      position:absolute;
      z-index:1;
      display:block;
      width:var(--size);
      height:auto;
      max-width:none;
      opacity:.42;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
      animation:bubble-drift var(--duration) ease-in-out var(--delay) infinite alternate;
      transform-origin:center;
      contain:layout paint;
    }

    @keyframes bubble-drift{
      0%{transform:translate3d(0,0,0) rotate(var(--rotation-start)) scale(var(--scale-start))}
      33%{transform:translate3d(var(--x1),var(--y1),0) rotate(var(--rotation-mid)) scale(var(--scale-mid))}
      66%{transform:translate3d(var(--x2),var(--y2),0) rotate(var(--rotation-late)) scale(var(--scale-late))}
      100%{transform:translate3d(var(--x3),var(--y3),0) rotate(var(--rotation-end)) scale(var(--scale-end))}
    }

    .wrap{
      position:relative;
      z-index:3;
      width:min(1120px,100%);
      margin-inline:auto;
      padding:24px clamp(16px,3.5vw,48px) 60px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      color:var(--ink);
      text-decoration:none;
    }

    .brand-logo{
      width:38px;
      aspect-ratio:1;
      border-radius:12px;
      background:linear-gradient(145deg,var(--accent),var(--accent-2));
      box-shadow:0 8px 30px rgba(95,212,255,.16);
    }

    .brand-title{
      font-family:Unbounded,Inter,sans-serif;
      font-size:clamp(15px,2vw,21px);
      font-weight:800;
    }

    nav{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:18px;
    }

    nav a{
      color:var(--muted);
      font-weight:600;
      text-decoration:none;
    }

    nav a:hover,
    nav a[aria-current="page"]{
      color:var(--ink);
    }

    .entry-shell{
      width:min(940px,100%);
      margin:0 auto;
      padding-top:78px;
    }

    .entry-header{
      text-align:center;
    }

    .entry-date{
      color:var(--accent);
      font-size:12px;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    h1{
      max-width:18ch;
      margin:14px auto 18px;
      font-family:Unbounded,Inter,sans-serif;
      font-size:clamp(36px,6vw,64px);
      font-weight:800;
      line-height:1.08;
    }

    .entry-tags{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:8px;
      margin-top:18px;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      min-height:28px;
      padding:0 10px;
      border:1px solid rgba(95,212,255,.18);
      border-radius:999px;
      color:#ccefff;
      background:rgba(95,212,255,.07);
      font-size:11px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .entry-meta{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:8px 18px;
      margin-top:13px;
      color:var(--dim);
      font-size:12px;
      font-weight:700;
    }

    .hero-media{
      position:relative;
      min-height:360px;
      margin-top:38px;
      overflow:hidden;
      border:1px solid rgba(95,212,255,.14);
      border-radius:var(--radius);
      background:
        radial-gradient(circle at 75% 12%, rgba(138,125,255,.22), transparent 38%),
        #0c1220;
      box-shadow:var(--shadow);
    }

    .hero-video{
      display:block;
      width:100%;
      height:100%;
      min-height:360px;
      max-height:560px;
      object-fit:cover;
      background:#0c1220;
    }

    .milestone{
      max-width:780px;
      margin:28px auto 0;
      padding:24px 28px;
      border:1px solid rgba(239,191,4,.15);
      border-radius:18px;
      text-align:center;
      background:linear-gradient(180deg,rgba(15,21,36,.92),rgba(17,26,43,.92));
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
    }

    .milestone-label{
      display:block;
      margin-bottom:9px;
      color:var(--gold);
      font-size:11px;
      font-weight:800;
      letter-spacing:.15em;
      text-transform:uppercase;
    }

    .milestone-text{
      margin:0;
      color:#dce6ff;
      font-family:Unbounded,Inter,sans-serif;
      font-size:clamp(18px,2.6vw,26px);
      font-weight:700;
      line-height:1.42;
    }

    .article-body{
      width:min(800px,100%);
      margin:48px auto 0;
    }

    .article-body p{
      margin:0 0 24px;
      color:#c7d2e8;
      font-size:clamp(16px,1.8vw,18px);
      line-height:1.86;
    }

    .article-image-wrap{
      width:min(1040px,calc(100vw - 32px));
      margin:34px 50% 38px;
      transform:translateX(-50%);
    }

    .article-image{
      display:block;
      width:100%;
      height:auto;
      max-height:820px;
      object-fit:contain;
      border:1px solid var(--line);
      border-radius:18px;
      background:#090d16;
      box-shadow:0 16px 40px rgba(0,0,0,.34);
    }

    .article-video-wrap{
      width:min(1040px,calc(100vw - 32px));
      margin:34px 50% 38px;
      transform:translateX(-50%);
    }

    .article-video{
      display:block;
      width:100%;
      max-height:720px;
      border:1px solid var(--line);
      border-radius:18px;
      background:#090d16;
      box-shadow:0 16px 40px rgba(0,0,0,.34);
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:48px;
      color:var(--accent);
      font-weight:700;
      text-decoration:none;
    }

    .back-link:hover{color:var(--ink)}

    .load-state{
      width:min(800px,100%);
      margin:80px auto 0;
      padding:30px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      color:var(--muted);
      background:rgba(15,21,36,.82);
      box-shadow:var(--shadow);
    }

    .load-state strong{
      display:block;
      margin-bottom:8px;
      color:var(--ink);
      font-family:Unbounded,Inter,sans-serif;
    }

    footer{
      margin-top:54px;
      padding-top:20px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:12px;
    }

    @media (max-width:850px){
      header{
        align-items:flex-start;
        flex-direction:column;
      }

      nav{justify-content:flex-start}
      .entry-shell{padding-top:54px}
      .hero-media,
      .hero-video{min-height:260px}
      .article-image-wrap,
      .article-video-wrap{width:100%; margin-left:0; margin-right:0; transform:none}
    }

    @media (prefers-reduced-motion:reduce){
      .floating-controller{animation:none}
      html{scroll-behavior:auto}
    }
  </style>
</head>

<body>
  <div id="controllerField" class="controller-field" aria-hidden="true"></div>

  <div class="wrap">
    <header>
      <a class="brand" href="/">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-title">Kalan Computer Entertainment of America</span>
      </a>

      <nav aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/projects.html">Projects</a>
        <a href="/devlog.html" aria-current="page">Devlog</a>
        <a href="/about.html">About</a>
      </nav>
    </header>

    <main id="pageMain">
      <div id="loadingState" class="load-state">
        <strong>Loading devlog entry…</strong>
        Reading the selected update from /media/devlog/.
      </div>
    </main>

    <footer>
      © <span id="year"></span> Kalan Computer Entertainment of America. All rights reserved.
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const DEVLOG_ROOT = "/media/devlog";

    function parseFolderDate(folderName){
      if(!/^\d{8}$/.test(folderName)) return null;

      const day = Number(folderName.slice(0,2));
      const month = Number(folderName.slice(2,4));
      const year = Number(folderName.slice(4,8));
      const date = new Date(year, month - 1, day);

      if(
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
      ){
        return null;
      }

      return date;
    }

    function formatFolderDate(folderName){
      const date = parseFolderDate(folderName);
      if(!date) return folderName;

      return new Intl.DateTimeFormat("en-US", {
        month:"long",
        day:"numeric",
        year:"numeric"
      }).format(date);
    }

    function createTextElement(tagName, className, text){
      const element = document.createElement(tagName);
      if(className) element.className = className;
      element.textContent = text ?? "";
      return element;
    }

    function parseMediaFilename(filename){
      filename = String(filename || "").trim();

      if(
        !filename ||
        filename.includes("/") ||
        filename.includes("\\") ||
        filename.includes("..")
      ){
        return null;
      }

      if(/\.(?:jpe?g|png|webp|gif|avif)$/i.test(filename)){
        return {type:"image", filename};
      }

      if(/\.(?:mp4|webm)$/i.test(filename)){
        return {type:"video", filename};
      }

      return null;
    }

    function appendMedia(body, folderName, media){
      if(media.type === "image"){
        const imageWrap = document.createElement("figure");
        imageWrap.className = "article-image-wrap";

        const image = document.createElement("img");
        image.className = "article-image";
        image.src = `${DEVLOG_ROOT}/${folderName}/${encodeURIComponent(media.filename)}`;
        image.alt = "";
        image.loading = "lazy";
        image.decoding = "async";

        imageWrap.appendChild(image);
        body.appendChild(imageWrap);
        return;
      }

      if(media.type === "video"){
        const videoWrap = document.createElement("div");
        videoWrap.className = "article-video-wrap";

        const video = document.createElement("video");
        video.className = "article-video";
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;

        // Article videos do not autoplay or loop.
        const source = document.createElement("source");
        source.src = `${DEVLOG_ROOT}/${folderName}/${encodeURIComponent(media.filename)}`;
        source.type = media.filename.toLowerCase().endsWith(".webm")
          ? "video/webm"
          : "video/mp4";

        video.appendChild(source);
        videoWrap.appendChild(video);
        body.appendChild(videoWrap);
      }
    }

    function appendBodyItem(body, folderName, item){
      // Tokens may appear anywhere inside a body string.
      // Example: "Breadboard test. [{video01.mp4}]"
      const tokenPattern = /\[\{([^{}]+)\}\]/g;
      let lastIndex = 0;
      let match;

      while((match = tokenPattern.exec(item)) !== null){
        const before = item.slice(lastIndex, match.index).trim();

        if(before){
          body.appendChild(createTextElement("p", "", before));
        }

        const media = parseMediaFilename(match[1]);

        if(media){
          appendMedia(body, folderName, media);
        }else{
          body.appendChild(createTextElement("p", "", match[0]));
        }

        lastIndex = tokenPattern.lastIndex;
      }

      const after = item.slice(lastIndex).trim();

      if(after){
        body.appendChild(createTextElement("p", "", after));
      }
    }

    function buildEntry(folderName, content){
      const shell = document.createElement("article");
      shell.className = "entry-shell";

      const entryHeader = document.createElement("header");
      entryHeader.className = "entry-header";

      entryHeader.appendChild(
        createTextElement("div", "entry-date", formatFolderDate(folderName))
      );

      entryHeader.appendChild(
        createTextElement("h1", "", content.header || "Untitled Update")
      );

      if(Array.isArray(content.tags) && content.tags.length){
        const tags = document.createElement("div");
        tags.className = "entry-tags";

        for(const tagName of content.tags){
          tags.appendChild(createTextElement("span", "tag", tagName));
        }

        entryHeader.appendChild(tags);
      }

      const metaValues = [];
      if(content.category) metaValues.push(content.category);
      if(content.readTime) metaValues.push(content.readTime);

      if(metaValues.length){
        const meta = document.createElement("div");
        meta.className = "entry-meta";

        for(const value of metaValues){
          meta.appendChild(createTextElement("span", "", value));
        }

        entryHeader.appendChild(meta);
      }

      shell.appendChild(entryHeader);

      const media = document.createElement("div");
      media.className = "hero-media";

      const video = document.createElement("video");
      video.className = "hero-video";
      video.autoplay = true;
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      video.preload = "metadata";

      const source = document.createElement("source");
      source.src = `${DEVLOG_ROOT}/${folderName}/banner.mp4`;
      source.type = "video/mp4";
      video.appendChild(source);

      video.addEventListener("error", () => media.remove());
      media.appendChild(video);
      shell.appendChild(media);

      const banner = content.banner || {};
      if(banner.header || banner.text){
        const milestone = document.createElement("section");
        milestone.className = "milestone";

        milestone.appendChild(
          createTextElement("span", "milestone-label", banner.header || "Current Milestone")
        );

        milestone.appendChild(
          createTextElement("p", "milestone-text", banner.text || "")
        );

        shell.appendChild(milestone);
      }

      const body = document.createElement("div");
      body.className = "article-body";

      const bodyItems = Array.isArray(content.body) ? content.body : [];

      for(const item of bodyItems){
        if(typeof item !== "string" || !item.trim()) continue;
        appendBodyItem(body, folderName, item);
      }

      if(!body.children.length && content.description){
        body.appendChild(createTextElement("p", "", content.description));
      }

      shell.appendChild(body);

      const back = document.createElement("a");
      back.className = "back-link";
      back.href = "/devlog.html";
      back.textContent = "← Back to Devlog";
      shell.appendChild(back);

      return shell;
    }

    async function loadEntry(){
      const pageMain = document.getElementById("pageMain");
      const params = new URLSearchParams(window.location.search);
      const folderName = params.get("date");

      if(!folderName || !parseFolderDate(folderName)){
        pageMain.innerHTML = `
          <div class="load-state">
            <strong>Invalid devlog entry</strong>
            The URL must include a valid date such as ?date=20082026.
          </div>
        `;
        return;
      }

      const contentUrl = `${DEVLOG_ROOT}/${folderName}/PageContent.json`;

      try{
        const response = await fetch(contentUrl, {cache:"no-store"});

        if(!response.ok){
          throw new Error(`${contentUrl} returned HTTP ${response.status}`);
        }

        const content = await response.json();

        document.title = `${content.header || "Devlog Entry"} — KCEA`;
        pageMain.replaceChildren(buildEntry(folderName, content));
      }catch(error){
        console.error("Devlog entry load failed:", error);

        const state = document.createElement("div");
        state.className = "load-state";
        state.appendChild(createTextElement("strong", "", "Devlog entry unavailable"));
        state.appendChild(
          document.createTextNode(` Could not load ${contentUrl}. ${error.message}`)
        );

        pageMain.replaceChildren(state);
      }
    }

    loadEntry();

    (function createControllerField(){
      const controllerImages = [
        "/docs/Controller_Profile_00FFF0.svg",
        "/docs/Controller_Profile_4E45E8.svg",
        "/docs/Controller_Profile_EFBF04.svg"
      ];

      const field = document.getElementById("controllerField");
      const isMobile = window.matchMedia("(max-width:850px)").matches;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
      const controllerCount = isMobile ? 7 : 16;
      const random = (min,max) => Math.random() * (max - min) + min;
      const randomSigned = (min,max) => random(min,max) * (Math.random() < .5 ? -1 : 1);

      for(let i = 0; i < controllerCount; i++){
        const controller = document.createElement("img");
        const baseSize = random(62,170);
        const duration = random(10,22);

        controller.className = "floating-controller";
        controller.src = controllerImages[Math.floor(Math.random() * controllerImages.length)];
        controller.alt = "";
        controller.setAttribute("aria-hidden","true");
        controller.decoding = "async";
        controller.draggable = false;

        controller.style.left = random(-8,96) + "%";
        controller.style.top = random(-6,96) + "%";
        controller.style.setProperty(
          "--size",
          `clamp(${Math.round(baseSize*.72)}px, ${(baseSize/12).toFixed(2)}vw, ${Math.round(baseSize)}px)`
        );
        controller.style.setProperty("--duration", duration.toFixed(2) + "s");
        controller.style.setProperty("--delay", (-random(0,duration)).toFixed(2) + "s");
        controller.style.setProperty("--x1", randomSigned(18,62).toFixed(1) + "px");
        controller.style.setProperty("--y1", randomSigned(18,58).toFixed(1) + "px");
        controller.style.setProperty("--x2", randomSigned(34,92).toFixed(1) + "px");
        controller.style.setProperty("--y2", randomSigned(32,88).toFixed(1) + "px");
        controller.style.setProperty("--x3", randomSigned(15,74).toFixed(1) + "px");
        controller.style.setProperty("--y3", randomSigned(22,76).toFixed(1) + "px");
        controller.style.setProperty("--rotation-start", random(-28,28).toFixed(1) + "deg");
        controller.style.setProperty("--rotation-mid", random(-34,34).toFixed(1) + "deg");
        controller.style.setProperty("--rotation-late", random(-38,38).toFixed(1) + "deg");
        controller.style.setProperty("--rotation-end", random(-30,30).toFixed(1) + "deg");
        controller.style.setProperty("--scale-start", random(.62,.88).toFixed(2));
        controller.style.setProperty("--scale-mid", random(.78,1.16).toFixed(2));
        controller.style.setProperty("--scale-late", random(.68,1.28).toFixed(2));
        controller.style.setProperty("--scale-end", random(.74,1.20).toFixed(2));

        if(reducedMotion){
          controller.style.animation = "none";
          controller.style.transform = `rotate(${random(-25,25).toFixed(1)}deg) scale(${random(.7,1.05).toFixed(2)})`;
        }

        controller.addEventListener("error", () => controller.remove());
        field.appendChild(controller);
      }
    })();
  </script>
</body>
</html>
